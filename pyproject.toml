[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workstyle-technology-distance"
version = "0.1.0"
description = "Transformer-based organizational distance measures for technology adoption economics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
transformer = ["sentence-transformers>=3.0", "torch>=2.0"]
causal = ["econml>=0.16"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
